name: infra-dev-destroy

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  BICEP_FILE: infra/bicep/main.bicep
  BICEP_PARAMS: infra/bicep/params/dev.parameters.json

jobs:
  destroy_infra_dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure backup container exists
        run: >
          az storage container create
          --account-name "${{ vars.BACKUP_STORAGE_ACCOUNT }}"
          --account-key "${{ secrets.BACKUP_STORAGE_KEY }}"
          --name "${{ vars.BACKUP_CONTAINER }}"

      - name: Export SQL DB to BACPAC
        shell: bash
        run: |
          set -euo pipefail
          if ! az sql db show \
            --resource-group "${{ vars.AZURE_RG_DEV }}" \
            --server "${{ vars.AZURE_SQL_SERVER_NAME_DEV }}" \
            --name "${{ vars.AZURE_SQL_DB_NAME_DEV }}" \
            -o none 2>/dev/null; then
            echo "SQL DB not found. Skipping backup."
            exit 0
          fi

          timestamp="$(date -u +"%Y%m%d-%H%M%S")"
          bacpac="contenthub-dev-${timestamp}.bacpac"
          storage_uri="https://${{ vars.BACKUP_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ vars.BACKUP_CONTAINER }}/${bacpac}"

          export_json="$(az sql db export \
            --admin-user "${{ vars.SQL_ADMIN_LOGIN_DEV }}" \
            --admin-password "${{ secrets.SQL_ADMIN_PASSWORD_DEV }}" \
            --name "${{ vars.AZURE_SQL_DB_NAME_DEV }}" \
            --server "${{ vars.AZURE_SQL_SERVER_NAME_DEV }}" \
            --resource-group "${{ vars.AZURE_RG_DEV }}" \
            --storage-key-type "StorageAccessKey" \
            --storage-key "${{ secrets.BACKUP_STORAGE_KEY }}" \
            --storage-uri "$storage_uri" \
            -o json)"

          request_id="$(echo "$export_json" | jq -r '.requestId')"
          operation_link="$(echo "$export_json" | jq -r '.operationStatusLink')"

          if [[ -z "$request_id" || "$request_id" == "null" ]]; then
            echo "Failed to start export or missing requestId."
            exit 1
          fi

          if [[ -z "$operation_link" || "$operation_link" == "null" ]]; then
            operation_link="https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RG_DEV }}/providers/Microsoft.Sql/servers/${{ vars.AZURE_SQL_SERVER_NAME_DEV }}/databases/${{ vars.AZURE_SQL_DB_NAME_DEV }}/importExportStatus/${request_id}?api-version=2021-11-01"
          fi

          echo "Export requestId: $request_id"

          # Wait for blob to appear and stop growing.
          last_size=""
          stable_count=0
          for i in {1..60}; do
            exists="$(az storage blob exists \
              --account-name "${{ vars.BACKUP_STORAGE_ACCOUNT }}" \
              --account-key "${{ secrets.BACKUP_STORAGE_KEY }}" \
              --container-name "${{ vars.BACKUP_CONTAINER }}" \
              --name "$bacpac" \
              --query "exists" -o tsv)"

            if [[ "$exists" != "true" ]]; then
              echo "BACPAC not found yet. Retrying..."
              sleep 30
              continue
            fi

            size="$(az storage blob show \
              --account-name "${{ vars.BACKUP_STORAGE_ACCOUNT }}" \
              --account-key "${{ secrets.BACKUP_STORAGE_KEY }}" \
              --container-name "${{ vars.BACKUP_CONTAINER }}" \
              --name "$bacpac" \
              --query "properties.contentLength" -o tsv)"

            if [[ -n "$last_size" && "$size" == "$last_size" ]]; then
              stable_count=$((stable_count + 1))
            else
              stable_count=0
            fi

            echo "BACPAC size: $size bytes (stable checks: $stable_count)"

            if [[ "$stable_count" -ge 2 ]]; then
              echo "BACPAC size stabilized."
              break
            fi

            last_size="$size"
            sleep 30
          done

          if [[ "$stable_count" -lt 2 ]]; then
            echo "BACPAC did not stabilize within the expected time."
            exit 1
          fi

      - name: Delete infra resources (bicep)
        run: >
          az group delete
          --name "${{ vars.AZURE_RG_DEV }}"
          --yes

      - name: Wait for resource group deletion
        run: >
          az group wait
          --name "${{ vars.AZURE_RG_DEV }}"
          --deleted

      - name: Recreate resource group
        shell: bash
        run: |
          set -euo pipefail
          location="$(jq -r '.parameters.location.value' "${{ env.BICEP_PARAMS }}")"
          if [[ -z "$location" || "$location" == "null" ]]; then
            echo "Could not read location from parameters."
            exit 1
          fi
          az group create --name "${{ vars.AZURE_RG_DEV }}" --location "$location"
