<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/">
      <span class="brand-kicker">TECH</span>
      <span class="brand-title">ContentHub</span>
    </a>

    <button
      class="nav-toggle"
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-controls="primary-nav"
      aria-label="Toggle navigation menu">
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
    </button>

    <nav class="nav" id="primary-nav" [class.open]="isMobileMenuOpen">
      <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">Home</a>

      <ng-container *ngIf="auth.isAuthenticated(); else guest">
        <a class="nav-link" routerLink="/create" routerLinkActive="active" (click)="closeMobileMenu()">Create</a>

        <div class="profile-menu" [class.open]="isWorkspaceMenuOpen">
          <button class="nav-btn profile-trigger" type="button" (click)="toggleWorkspaceMenu()">
            Workspace
            <span class="chevron">▾</span>
          </button>

          <div class="menu" *ngIf="isWorkspaceMenuOpen">
            <a class="menu-item" routerLink="/drafts" (click)="closeAllMenus()">Drafts</a>
            <a class="menu-item" routerLink="/published" (click)="closeAllMenus()">Published</a>
            <a class="menu-item" routerLink="/archived" (click)="closeAllMenus()">Archived</a>
          </div>
        </div>

        <div class="profile-menu" [class.open]="isProfileMenuOpen">
          <button class="nav-btn profile-trigger" type="button" (click)="toggleProfileMenu()">
            Profile
            <span class="chevron">▾</span>
          </button>

          <div class="menu" *ngIf="isProfileMenuOpen">
            <a class="menu-item" routerLink="/account" (click)="closeAllMenus()">Account settings</a>
            <a class="menu-item" *ngIf="auth.isAdmin()" routerLink="/admin" (click)="closeAllMenus()">Admin tools</a>
            <button class="menu-item danger" type="button" (click)="logout()">Logout</button>
          </div>
        </div>
      </ng-container>
      <ng-template #guest>
        <a class="nav-link" routerLink="/login" routerLinkActive="active" (click)="closeMobileMenu()">Login</a>
        <a class="nav-link" routerLink="/register" routerLinkActive="active" (click)="closeMobileMenu()">Register</a>
      </ng-template>
    </nav>
  </div>
</header>

<div class="nav-scrim" *ngIf="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<div class="cookie-banner" *ngIf="showCookieBanner">
  <div class="cookie-banner__content">
    <p>
      We use cookies and basic telemetry to keep the service reliable. Read our
      <a routerLink="/privacy">privacy policy</a>.
    </p>
    <button class="btn" type="button" (click)="acceptCookies()">Accept</button>
  </div>
</div>

<footer class="footer">
  <div class="footer-inner">
    <div>
      <p class="footer-brand">ContentHub</p>
      <p class="footer-muted">A clean, modern publishing space for developers.</p>
    </div>
    <div class="footer-links">
      <a href="#" class="footer-link">About</a>
      <a href="#" class="footer-link">Docs</a>
      <a href="#" class="footer-link">Contact</a>
      <a routerLink="/privacy" class="footer-link">Privacy</a>
    </div>
  </div>
</footer>

<button
  class="theme-fab"
  type="button"
  (click)="toggleTheme()"
  [attr.aria-label]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
  title="Toggle theme">
  <span class="theme-icon" aria-hidden="true">
    {{ theme === 'dark' ? '◐' : '☼' }}
  </span>
</button>
