<section class="page">
  <header class="header">
    <div class="back-row">
      <a class="back-link" routerLink="/">← Back</a>
    </div>
    <div class="header-copy">
      <p class="eyebrow">New draft</p>
      <h1>Create Content</h1>
      <p class="subtitle">Share an idea, a guide, or a quick update.</p>
    </div>
  </header>

  <p class="notice">You’re creating this post under your logged‑in account.</p>

  <div class="card">
    <label class="label">
      Title
      <input class="input" type="text" [(ngModel)]="title" placeholder="e.g. My first post" />
    </label>

    <label class="label">
      Body
      <div class="quill-editor" #editor></div>
    </label>

    <label class="label">
      Cover image (optional)
      <input class="input" type="file" accept="image/png,image/jpeg" (change)="onFileSelected($event)" />
    </label>

    <div class="image-preview" *ngIf="croppedPreviewUrl">
      <img [src]="croppedPreviewUrl" alt="Cropped cover preview" />
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button class="btn" (click)="submit()" [disabled]="isSubmitting || isUploading">
      {{ isSubmitting ? 'Saving…' : isUploading ? 'Uploading…' : 'Create' }}
    </button>
  </div>

  <div class="modal" *ngIf="isCropping">
    <div class="modal__backdrop" (click)="cancelCrop()"></div>
    <div class="modal__content">
      <h3>Crop cover image</h3>
      <div class="cropper-frame">
        <img #cropperImage alt="Cropper preview" />
      </div>
      <div class="modal__actions">
        <button class="btn ghost" type="button" (click)="cancelCrop()">Cancel</button>
        <button class="btn" type="button" (click)="applyCrop()">Use crop</button>
      </div>
    </div>
  </div>
</section>
