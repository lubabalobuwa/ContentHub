name: deploy-dev

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["infra-dev"]
    types:
      - completed

permissions:
  contents: read
  id-token: write

env:
  API_PROJECT: src/ContentHub.Api/ContentHub.Api.csproj
  FUNCTION_PROJECT: src/ContentHub.Functions/ContentHub.Functions.csproj
  WEBAPP_PACKAGE: artifacts/api
  FUNCTION_PACKAGE: artifacts/functions
  FUNCTION_ZIP: artifacts/functions.zip

jobs:
  deploy_dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish API
        run: dotnet publish "${{ env.API_PROJECT }}" -c Release -o "${{ env.WEBAPP_PACKAGE }}"

      - name: Publish Function App
        run: |
          mkdir -p "artifacts"
          dotnet publish "${{ env.FUNCTION_PROJECT }}" -c Release -o "${{ env.FUNCTION_PACKAGE }}"
          cd "${{ env.FUNCTION_PACKAGE }}"
          zip -r "../${{ env.FUNCTION_ZIP }}" .

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.API_APP_NAME_DEV }}
          package: ${{ env.WEBAPP_PACKAGE }}

      - name: Deploy Function App to Azure Functions
        run: |
          az functionapp show \
            --resource-group "${{ vars.AZURE_RG_DEV }}" \
            --name "${{ vars.FUNCTION_APP_NAME_DEV }}" \
            --query "name" -o tsv
          az functionapp deployment source config-zip \
            --resource-group "${{ vars.AZURE_RG_DEV }}" \
            --name "${{ vars.FUNCTION_APP_NAME_DEV }}" \
            --src "${{ env.FUNCTION_ZIP }}"

      - name: Verify Function App is reachable
        run: |
          FUNCTION_HOST="https://${{ vars.FUNCTION_APP_NAME_DEV }}.azurewebsites.net"
          echo "Function App host: $FUNCTION_HOST"
          curl -fsS "$FUNCTION_HOST/" || curl -fsS "$FUNCTION_HOST/admin/host/status" || curl -I "$FUNCTION_HOST"

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/content-web"
          output_location: "dist/content-web/browser"
