<section class="page">
  <header class="header">
    <div class="back-row">
      <a class="back-link" [routerLink]="returnUrl">← Back</a>
    </div>
    <div class="header-copy">
      <p class="eyebrow">Edit</p>
      <h1>Edit Content</h1>
      <p class="subtitle">Update your draft or published post.</p>
    </div>
  </header>

  <div class="card">
    <label class="label">
      Title
      <input class="input" type="text" [(ngModel)]="title" />
    </label>

    <label class="label">
      Body
      <div class="quill-editor" #editor></div>
    </label>

    <label class="label">
      Cover image (optional)
      <div class="upload-row">
        <input class="input file-input" type="file" accept="image/png,image/jpeg" (change)="onFileSelected($event)" />
        <button class="upload-btn" type="button" (click)="uploadImage()" [disabled]="isUploading">
          {{ isUploading ? 'Uploading…' : 'Upload image' }}
        </button>
      </div>
    </label>

    <div class="image-preview" *ngIf="croppedPreviewUrl">
      <img [src]="croppedPreviewUrl" alt="Cropped cover preview" />
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button class="btn" (click)="submit()" [disabled]="isSubmitting || isUploading">
      {{ isSubmitting ? 'Saving…' : 'Update' }}
    </button>
  </div>

  <div class="modal" *ngIf="isCropping">
    <div class="modal__backdrop" (click)="cancelCrop()"></div>
    <div class="modal__content">
      <h3>Crop cover image</h3>
      <div class="cropper-frame">
        <img #cropperImage alt="Cropper preview" />
      </div>
      <div class="modal__actions">
        <button class="btn ghost" type="button" (click)="cancelCrop()">Cancel</button>
        <button class="btn" type="button" (click)="applyCrop()">Use crop</button>
      </div>
    </div>
  </div>
</section>
