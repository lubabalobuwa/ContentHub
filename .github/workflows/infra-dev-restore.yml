name: infra-dev-restore

on:
  workflow_dispatch:
    inputs:
      db_edition:
        description: "SQL DB edition (e.g., Basic, Standard, Premium)"
        required: false
        default: "Basic"
      db_service_objective:
        description: "SQL DB service objective (e.g., Basic, S0, P1)"
        required: false
        default: "Basic"

permissions:
  contents: read
  id-token: write

jobs:
  restore_sql_dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Select latest BACPAC
        id: latest_backup
        shell: bash
        run: |
          set -euo pipefail
          latest="$(az storage blob list \
            --account-name "${{ vars.BACKUP_STORAGE_ACCOUNT }}" \
            --account-key "${{ secrets.BACKUP_STORAGE_KEY }}" \
            --container-name "${{ vars.BACKUP_CONTAINER }}" \
            --query "sort_by([?ends_with(name, '.bacpac')], &name)[-1].name" -o tsv)"

          if [[ -z "$latest" || "$latest" == "null" ]]; then
            echo "No BACPAC backups found."
            exit 1
          fi

          echo "Latest backup: $latest"
          echo "backup_name=$latest" >> "$GITHUB_OUTPUT"

      - name: Delete existing DB
        run: >
          az sql db delete
          --resource-group "${{ vars.AZURE_RG_DEV }}"
          --server "${{ vars.AZURE_SQL_SERVER_NAME_DEV }}"
          --name "${{ vars.AZURE_SQL_DB_NAME_DEV }}"
          --yes

      - name: Import BACPAC into SQL DB
        shell: bash
        run: |
          set -euo pipefail
          bacpac="${{ steps.latest_backup.outputs.backup_name }}"
          storage_uri="https://${{ vars.BACKUP_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ vars.BACKUP_CONTAINER }}/${bacpac}"

          import_url="https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RG_DEV }}/providers/Microsoft.Sql/servers/${{ vars.AZURE_SQL_SERVER_NAME_DEV }}/import?api-version=2021-11-01"

          az rest \
            --method post \
            --url "$import_url" \
            --body '{
              "storageKeyType": "StorageAccessKey",
              "storageKey": "'"${{ secrets.BACKUP_STORAGE_KEY }}"'",
              "storageUri": "'"$storage_uri"'",
              "administratorLogin": "'"${{ vars.SQL_ADMIN_LOGIN_DEV }}"'",
              "administratorLoginPassword": "'"${{ secrets.SQL_ADMIN_PASSWORD_DEV }}"'",
              "databaseName": "'"${{ vars.AZURE_SQL_DB_NAME_DEV }}"'",
              "edition": "'"${{ inputs.db_edition }}"'",
              "serviceObjective": "'"${{ inputs.db_service_objective }}"'"
            }' \
            -o none

          # Wait for DB to appear and become Online.
          for i in {1..120}; do
            db_json="$(az sql db show \
              --resource-group "${{ vars.AZURE_RG_DEV }}" \
              --server "${{ vars.AZURE_SQL_SERVER_NAME_DEV }}" \
              --name "${{ vars.AZURE_SQL_DB_NAME_DEV }}" \
              -o json 2>/dev/null || true)"

            if [[ -z "$db_json" ]]; then
              echo "Database not available yet. Retrying..."
              sleep 30
              continue
            fi

            status="$(echo "$db_json" | jq -r '.status // empty')"
            echo "Database status: $status"

            if [[ "$status" == "Online" ]]; then
              echo "Database import completed."
              break
            fi

            sleep 30
          done

          if [[ "$status" != "Online" ]]; then
            echo "Database did not reach Online state within the expected time."
            exit 1
          fi
